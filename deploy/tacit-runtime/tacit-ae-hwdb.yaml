# TACIT artifact evaluation hardware database. Passed to the manager with
# `-a tacit-runtime/tacit-ae-hwdb.yaml` by scripts/tacit-ae, because the
# live deploy/config_hwdb.yaml is gitignored (config_*.yaml, at any depth, hence
# this name) and does not survive a fresh clone.
#
# 2026-09-08: MegaBoom v3 + TACIT, SRAM packet queue physically 128 deep with the
# drop threshold (0x5C) and resume watermark (0x58) as MMIO registers, TraceDoctor
# oracle, WithSynthAsserts, FRFCFS (no LLC), 50 MHz RUNTIMEOPTIMIZED. Built from
#   DESIGN=FireSim TARGET_CONFIG=FireSimMegaBoomV3TacitSweepConfig
#   PLATFORM_CONFIG=FRFCFS16GBQuadRank_WithSynthAsserts_BaseF2PCIMConfig
# and verified on 2026-09-23 to elaborate byte-identically from the RTL this tree pins.
control_f2_megaboom_tacit_pcim_sweep_progthresh:
    agfi: agfi-001ac1ccd806a440c
    deploy_quintuplet_override: null
    deploy_makefrag_override: null
    custom_runtime_config: null

# 2026-09-07: the design every number in the paper was measured on. MegaBoom v3 +
# TACIT with the credit-based SRAM packet queue at its default depth of 64 entries,
# TraceDoctor oracle beside it, synthesizable asserts, FRFCFS memory, 50 MHz.
# (The sweep_progthresh entry above is physically 128 deep with the drop threshold
# and resume watermark as MMIO registers; left in for depth experiments.)
control_f2_megaboom_tacit_pcim_sramq_oracle_asserts_d64:
    agfi: agfi-056de453ff2513780
    deploy_quintuplet_override: null
    deploy_makefrag_override: null
    custom_runtime_config: null

# 2026-09-24: the same depth-64 design with the encoder's trap-packet privilege fix
# (from_priv tracked by the encoder, to_priv robust to back-to-back traps). Closed at
# WNS +0.047 ns. Pre-fix bitstreams mislabel the target privilege of an sret that lands
# on a re-executed ecall, which the decoder cannot recover from.
control_f2_megaboom_tacit_pcim_sramq_oracle_asserts_d64_trapprv:
    agfi: agfi-05391b88d93061429
    deploy_quintuplet_override: null
    deploy_makefrag_override: null
    custom_runtime_config: null

# 2026-09-24: two MegaBooms, each with its own encoder on a depth-64 SRAM queue, with the
# trap-packet privilege fix; no TraceDoctor. For the IPI-storm study, where both harts'
# traces are captured side by side. Closed at WNS +0.055 ns.
control_f2_dualmegaboom_tacit_pcim_sramq_d64_trapprv:
    agfi: agfi-0d6536328c45b4aea
    deploy_quintuplet_override: null
    deploy_makefrag_override: null
    custom_runtime_config: null
