# 2026-09-24: the same two designs with the encoder's trap-packet privilege fix
# (TacitParallelEncoder: from_priv tracked by the encoder, to_priv robust to back-to-back
# traps). The pre-fix bitstreams mislabel the target privilege of an sret that lands on a
# re-executed ecall (restarted syscall), which the decoder cannot recover from.
